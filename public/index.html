<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C'est pas le mot que tu crois</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Écran d'accueil : pseudo + recherche d'adversaire -->
  <section id="lobby" class="screen">
    <h1>PAS LE MOT</h1>
    <p class="sub">C'est pas le mot que tu crois</p>
    <form id="find-form">
      <label for="pseudo">Ton pseudo</label>
      <input id="pseudo" name="pseudo" maxlength="16" autocomplete="off" required>
      <button type="submit" id="find-btn" disabled>Trouver une partie</button>
    </form>
    <p id="status" class="status">Connexion au serveur...</p>
  </section>

  <!-- Écran de jeu -->
  <section id="game" class="screen" hidden>
    <header class="scoreboard">
      <div class="player" id="player-0"><span class="name"></span><span class="score">0</span></div>
      <div class="timer" id="timer" aria-label="Temps restant">4:00</div>
      <div class="player" id="player-1"><span class="name"></span><span class="score">0</span></div>
    </header>
    <p id="game-status" class="status">Remplis un mot puis appuie sur Entrée.</p>
    <div class="actions">
      <button type="button" id="buy-btn">Acheter une lettre (-1)</button>
    </div>
    <div class="board-area">
      <div id="board" class="board"></div>
      <div class="clues">
        <h2>Horizontal</h2>
        <ol id="clues-across"></ol>
        <h2>Vertical</h2>
        <ol id="clues-down"></ol>
      </div>
    </div>
  </section>

  <!-- Écran de fin -->
  <section id="result" class="screen" hidden>
    <h1 id="result-title"></h1>
    <p id="result-detail" class="status"></p>
    <button type="button" id="replay-btn">Rejouer</button>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
